# Produção: Caddy (HTTPS + front), API e PostgreSQL num único Droplet.
# O deploy (.github/workflows/deploy.yml) copia este arquivo para /opt/livro-de-receitas
# e gera o .env ao lado dele. Veja docs/deploy.md.
name: livro-de-receitas

# Sem limite, os logs do Docker crescem até encher o disco do servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api-image: &api-image ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY}/livro-de-receitas-api:${IMAGE_TAG:?defina IMAGE_TAG}

x-database-url: &database-url postgres://${POSTGRES_USER:-livro}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livro_de_receitas}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-livro_de_receitas}
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql/<versão>.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Aplica as migrações pendentes e termina. A API só sobe depois que ele conclui com sucesso.
  migrate:
    image: *api-image
    command: [node, --enable-source-maps, dist/db/migrate.js]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: *api-image
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # O servidor tem 1 GiB de RAM, dividido com o PostgreSQL e o Caddy.
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  caddy:
    image: ${IMAGE_REGISTRY:?defina IMAGE_REGISTRY}/livro-de-receitas-web:${IMAGE_TAG:?defina IMAGE_TAG}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?defina SITE_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  postgres_data:
  # Reservado para as fotos das receitas (H06).
  photos:
  # Certificados HTTPS. Não apague: o Let's Encrypt limita quantos certificados um domínio emite.
  caddy_data:
  caddy_config:
