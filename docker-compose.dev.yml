# PostgreSQL para desenvolvimento local: `pnpm db:up` sobe, `pnpm db:down` para.
# Lê as variáveis do .env da raiz (veja .env.example).
name: livro-de-receitas-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livro-dev}
      POSTGRES_DB: ${POSTGRES_DB:-livro_de_receitas}
    ports:
      - 127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql/<versão>.
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
